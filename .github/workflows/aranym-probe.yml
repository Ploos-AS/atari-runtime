name: aranym integration probe

on:
  push:
    paths:
      - ".github/workflows/aranym-probe.yml"
      - "ROADMAP.md"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/aranym-probe.yml"
  workflow_dispatch:

jobs:
  aranym-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARAnyM
        run: |
          sudo apt-get update
          sudo apt-get install -y aranym
      - name: Record ARAnyM baseline
        run: |
          set -eux
          command -v aranym
          dpkg-query -W -f='aranym_version=${Version}\n' aranym | tee aranym-version.txt
          (aranym --help || true) > aranym-help.txt 2>&1
          test -s aranym-version.txt
      - name: Provision EmuTOS for ARAnyM
        run: |
          set -eux
          curl --fail --location --retry 3 -o /tmp/emutos.zip \
            https://sourceforge.net/projects/emutos/files/emutos/1.4/emutos-512k-1.4.zip/download
          unzip -q /tmp/emutos.zip -d /tmp/emutos
          rom="$(find /tmp/emutos -type f \( -name 'etos512*.img' -o -name 'etos512*.rom' \) -print -quit)"
          test -n "$rom"
          mkdir -p "$HOME/.aranym"
          cp "$rom" "$HOME/.aranym/emutos-aranym.img"
          test -s "$HOME/.aranym/emutos-aranym.img"
          sha256sum "$HOME/.aranym/emutos-aranym.img" | tee aranym-emutos.sha256
      - name: Discover current FreeMiNT release
        run: |
          set -eux
          curl --fail --location --retry 3 \
            https://api.github.com/repos/freemint/freemint/releases/latest \
            -o freemint-release.json
          python3 - <<'PY'
          import json
          d=json.load(open("freemint-release.json"))
          print("freemint_release_tag="+d.get("tag_name",""))
          for a in d.get("assets",[]):
              print(a.get("name","")+"\t"+a.get("browser_download_url",""))
          PY
          python3 - <<'PY' > freemint-release.txt
          import json
          d=json.load(open("freemint-release.json"))
          print("tag="+d.get("tag_name",""))
          print("published_at="+d.get("published_at",""))
          for a in d.get("assets",[]):
              print("asset="+a.get("name","")+"\t"+a.get("browser_download_url",""))
          PY
          grep -q '^tag=.' freemint-release.txt
      - name: Inspect FreeMiNT 1.18.0 distribution
        run: |
          set -eux
          url="$(python3 - <<'PY'
          import json
          d=json.load(open("freemint-release.json"))
          for a in d.get("assets",[]):
              if a.get("name","").endswith(".zip"):
                  print(a["browser_download_url"])
                  break
          PY
          )"
          test -n "$url"
          curl --fail --location --retry 3 -o /tmp/freemint.zip "$url"
          unzip -l /tmp/freemint.zip | tee freemint-contents.txt
          unzip -q /tmp/freemint.zip -d /tmp/freemint
          find /tmp/freemint -type f \
            \( -iname '*aranym*' -o -iname 'mint*.prg' -o -iname 'mint*.xfs' -o -iname '*kernel*' \) \
            -printf '%P\n' | sort | tee freemint-boot-candidates.txt
          test -s freemint-boot-candidates.txt
      - name: Probe headless ARAnyM + EmuTOS startup
        run: |
          set -eux
          sudo apt-get install -y xvfb imagemagick x11-utils
          Xvfb :99 -screen 0 1024x768x24 > aranym-xvfb.log 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          sleep 1
          aranym -N -e > aranym-startup.log 2>&1 &
          aranym_pid=$!
          sleep 10
          import -display :99 -window root aranym-emutos.png
          identify aranym-emutos.png | tee aranym-framebuffer.txt
          colors="$(convert aranym-emutos.png -format %c histogram:info:- | wc -l)"
          printf 'aranym_framebuffer_colors=%s\n' "$colors" | tee -a aranym-framebuffer.txt
          test "$colors" -gt 1
          kill "$aranym_pid" 2>/dev/null || true
          wait "$aranym_pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true
          rc=0
          rc=${rc:-0}
          test "$rc" -eq 0
          test -s aranym-startup.log
          ! grep -Fq "No operating system found" aranym-startup.log
          printf 'aranym_startup_exit=%s\n' "$rc" | tee aranym-startup-result.txt
      - name: Record M4.1 host capabilities
        run: |
          {
            echo "milestone=M4.1"
            echo "emulator=ARAnyM"
            echo "guest_target=FreeMiNT"
            echo "machine_class=TT/Falcon-oriented"
            echo "status=BASELINE_PASS"
          } | tee aranym-baseline.txt
      - name: Upload ARAnyM baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: aranym-m4-1-baseline
          path: |
            aranym-version.txt
            aranym-help.txt
            aranym-emutos.sha256
            freemint-release.txt
            freemint-release.json
            freemint-contents.txt
            freemint-boot-candidates.txt
            aranym-startup.log
            aranym-startup-result.txt
            aranym-xvfb.log
            aranym-emutos.png
            aranym-framebuffer.txt
            aranym-baseline.txt
          if-no-files-found: error
