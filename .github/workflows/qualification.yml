name: qualification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build atari-runtime image
        run: docker build -t atari-runtime:m2 -f Containerfile .
      - name: Runtime metadata
        run: docker run --rm atari-runtime:m2 tools/runtime-info.sh
      - name: Hatari CLI capabilities
        run: docker run --rm atari-runtime:m2 sh -c 'hatari --help 2>&1 | tee /tmp/hatari-help.txt; grep -Ei "auto|run|program|gemdos|harddrive" /tmp/hatari-help.txt || true'
      - name: Hatari + EmuTOS smoke
        run: docker run --rm atari-runtime:m2 tools/smoke.sh
      - name: Verify M2 helper
        run: docker run --rm atari-runtime:m2 sh -n tools/qualify-m2.sh

  m2-emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [st, ste]
    steps:
      - uses: actions/checkout@v4
      - name: Build atari-runtime image
        run: docker build -t atari-runtime:m2 -f Containerfile .
      - name: Download canonical atari-dev M2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -o /tmp/atari-dev-m2.zip             https://api.github.com/repos/Ploos-AS/atari-dev/actions/artifacts/10577129455/zip
          unzip -q /tmp/atari-dev-m2.zip -d artifacts
          test -s artifacts/HELLO.TOS
          sha256sum artifacts/HELLO.TOS
      - name: Probe Hatari program launch modes
        run: |
          test -s artifacts/MINIMAL.PRG
          for mode in auto hostarg; do
            name="atari-launch-${{ matrix.profile }}-$mode"
            rm -f "artifacts/launch-$mode-${{ matrix.profile }}.log"
            if [ "$mode" = auto ]; then
              launch_args="--auto C:\\MINIMAL.PRG"
            else
              launch_args="/runtime/artifacts/MINIMAL.PRG"
            fi
            set +e
            docker run --name "$name" \
              -v "$PWD/artifacts:/runtime/artifacts" \
              atari-runtime:m2 \
              sh -c "xvfb-run -a hatari --machine '${{ matrix.profile }}' --memsize 1 --tos /runtime/roms/emutos.img --harddrive /runtime/artifacts --gemdos-drive C --run-vbls 1000 $launch_args" \
              >"artifacts/launch-$mode-${{ matrix.profile }}.log" 2>&1
            rc=$?
            set -e
            echo "=== launch mode=$mode rc=$rc ==="
            cat "artifacts/launch-$mode-${{ matrix.profile }}.log" || true
          done
          echo "=== Hatari launch-related help ==="
          docker run --rm atari-runtime:m2 sh -c 'hatari --help 2>&1 | grep -Ei "auto|run-vbls|program|harddrive|gemdos" || true'
      - name: Execute GEMDOS marker probe
        run: |
          rm -f artifacts/MINPASS.TXT
          test -s artifacts/MINIMAL.PRG
          name="atari-m2-${{ matrix.profile }}"
          set +e
          docker run --name "$name" \
            -v "$PWD/artifacts:/runtime/artifacts" \
            atari-runtime:m2 \
            xvfb-run -a hatari \
              --machine "${{ matrix.profile }}" \
              --memsize 1 \
              --tos /runtime/roms/emutos.img \
              --harddrive /runtime/artifacts \
              --gemdos-drive C \
              --trace gemdos,cpu_disasm \
              --trace-file /runtime/artifacts/hatari-trace-${{ matrix.profile }}.log \
              --log-level debug \
              --log-file /runtime/artifacts/hatari-debug-${{ matrix.profile }}.log \
              --auto 'C:\MINIMAL.PRG' \
              >"artifacts/hatari-stdout-${{ matrix.profile }}.log" \
              2>"artifacts/hatari-stderr-${{ matrix.profile }}.log" &
          pid=$!
          set -e

          found=0
          exited=0
          rc=0
          for i in $(seq 1 45); do
            if [ -s artifacts/MINPASS.TXT ]; then
              found=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              set +e
              wait "$pid"
              rc=$?
              set -e
              exited=1
              echo "Hatari/container exited before marker (rc=$rc)"
              break
            fi
            sleep 1
          done

          echo "=== Hatari stderr ==="
          cat "artifacts/hatari-stderr-${{ matrix.profile }}.log" 2>/dev/null || true
          echo "=== Hatari stdout ==="
          cat "artifacts/hatari-stdout-${{ matrix.profile }}.log" 2>/dev/null || true
          echo "=== Hatari debug log ==="
          cat "artifacts/hatari-debug-${{ matrix.profile }}.log" 2>/dev/null || true
          echo "=== Hatari trace: autostart / GEMDOS / program-load clues ==="
          grep -Ei 'auto|minimal|gemdos|pexec|load|program' "artifacts/hatari-trace-${{ matrix.profile }}.log" 2>/dev/null | tail -n 200 || true
          echo "=== Hatari trace tail ==="
          tail -n 120 "artifacts/hatari-trace-${{ matrix.profile }}.log" 2>/dev/null || true
          echo "=== docker logs ==="
          docker logs "$name" 2>&1 || true

          if [ "$exited" -eq 0 ]; then
            docker kill "$name" >/dev/null 2>&1 || true
            set +e
            wait "$pid"
            rc=$?
            set -e
          fi
          docker rm -f "$name" >/dev/null 2>&1 || true

          if [ "$found" -ne 1 ]; then
            echo "ERROR: marker missing; Hatari/container rc=$rc" >&2
            exit 1
          fi
          grep -F 'Ploos-AS atari-runtime minimal GEMDOS execution PASS' artifacts/MINPASS.TXT
          printf 'GEMDOS marker probe %s: PASS\n' "${{ matrix.profile }}"
      - name: Verify Atari-side GEMDOS execution evidence
        run: |
          test -s artifacts/MINPASS.TXT
          grep -F 'Ploos-AS atari-runtime minimal GEMDOS execution PASS' artifacts/MINPASS.TXT
          file artifacts/MINIMAL.PRG
