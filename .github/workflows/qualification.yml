name: qualification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build atari-runtime image
        run: docker build -t atari-runtime:m1 -f Containerfile .
      - name: Runtime metadata
        run: docker run --rm atari-runtime:m1 tools/runtime-info.sh
      - name: M1 ROM-free qualification
        run: docker run --rm atari-runtime:m1 tools/smoke.sh
