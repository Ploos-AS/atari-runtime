name: qualification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build atari-runtime image
        run: docker build -t atari-runtime:m2 -f Containerfile .
      - name: Runtime metadata
        run: docker run --rm atari-runtime:m2 tools/runtime-info.sh
      - name: Hatari CLI capabilities
        run: docker run --rm atari-runtime:m2 sh -c 'hatari --help 2>&1 | tee /tmp/hatari-help.txt; grep -Ei "auto|run|program|gemdos|harddrive" /tmp/hatari-help.txt || true'
      - name: Hatari + EmuTOS smoke
        run: docker run --rm atari-runtime:m2 tools/smoke.sh
      - name: Verify M2 helper
        run: docker run --rm atari-runtime:m2 sh -n tools/qualify-m2.sh

  m2-emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [st, ste]
    steps:
      - uses: actions/checkout@v4
      - name: Build atari-runtime image
        run: docker build -t atari-runtime:m2 -f Containerfile .
      - name: Install floppy image tools
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools
      - name: Download canonical atari-dev M2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -o /tmp/atari-dev-m2.zip             https://api.github.com/repos/Ploos-AS/atari-dev/actions/artifacts/10577129455/zip
          unzip -q /tmp/atari-dev-m2.zip -d artifacts
          test -s artifacts/HELLO.TOS
          sha256sum artifacts/HELLO.TOS
      - name: Execute raw probe from floppy image
        run: |
          rm -f artifacts/MINPASS.TXT artifacts/M2PROBE.ST
          test -s artifacts/MINIMAL.PRG

          # Build a real FAT12 Atari-compatible floppy image.  This deliberately
          # avoids Hatari's GEMDOS host-directory mapping as a launch dependency.
          dd if=/dev/zero of=artifacts/M2PROBE.ST bs=512 count=1440 status=none
          mkfs.fat -F 12 -n M2PROBE artifacts/M2PROBE.ST
          mmd -i artifacts/M2PROBE.ST ::/AUTO
          mcopy -i artifacts/M2PROBE.ST artifacts/MINIMAL.PRG ::/AUTO/MINIMAL.PRG
          mdir -i artifacts/M2PROBE.ST ::/AUTO

          name="atari-m2-${{ matrix.profile }}"
          set +e
          docker run --name "$name" \
            -v "$PWD/artifacts:/runtime/artifacts" \
            atari-runtime:m2 \
            xvfb-run -a hatari \
              --machine "${{ matrix.profile }}" \
              --memsize 1 \
              --tos /runtime/roms/emutos.img \
              --disk-a /runtime/artifacts/M2PROBE.ST \
              --harddrive /runtime/artifacts \
              --gemdos-drive C \
              --run-vbls 1500 \
              >"artifacts/hatari-stdout-${{ matrix.profile }}.log" \
              2>"artifacts/hatari-stderr-${{ matrix.profile }}.log"
          rc=$?
          set -e

          echo "=== Hatari stderr ==="
          cat "artifacts/hatari-stderr-${{ matrix.profile }}.log" || true
          echo "=== Hatari stdout ==="
          cat "artifacts/hatari-stdout-${{ matrix.profile }}.log" || true
          echo "Hatari rc=$rc"

          test "$rc" -eq 0
          test -s artifacts/MINPASS.TXT
          grep -F 'Ploos-AS atari-runtime minimal GEMDOS execution PASS' artifacts/MINPASS.TXT
          printf 'Floppy AUTO GEMDOS marker probe %s: PASS\n' "${{ matrix.profile }}"
      - name: Verify Atari-side GEMDOS execution evidence
        run: |
          test -s artifacts/MINPASS.TXT
          grep -F 'Ploos-AS atari-runtime minimal GEMDOS execution PASS' artifacts/MINPASS.TXT
          file artifacts/MINIMAL.PRG
